
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Tools</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <div class="logo">
            <span>PDF</span> Tools
        </div>
        <p>Ferramentas simples para seus documentos.</p>
    </header>

    <main>
        <section class="container">

            <div class="titulo">
                <h1>Juntar PDFs</h1>
                <p>Combine vários documentos em um único arquivo.</p>
            </div>

            <div class="upload-area">
                <div class="icone">📄</div>

                <h2>Adicione seus arquivos PDF</h2>

                <p>Selecione os documentos que deseja juntar.</p>

                <label for="arquivos" class="botao">
                    Selecionar PDFs
                </label>

                <input
                    type="file"
                    id="arquivos"
                    accept=".pdf,application/pdf"
                    multiple
                >

                <div id="lista-arquivos"></div>
            </div>

            <button class="botao-juntar" disabled>
                Juntar PDFs
            </button>

            <p class="aviso">
                Seus documentos serão processados temporariamente.
            </p>

        </section>
    </main>

    <footer>
        <p>PDF Tools © 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
